services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-prod
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    command: >
      redis-server --requirepass ${REDIS_PASS} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    sysctls:
      net.core.somaxconn: 1024
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

volumes:
  redis_data:
